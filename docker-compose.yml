version: "3.8"

services:
  qdrant:
    image: qdrant/qdrant:latest
    container_name: quarto-wiki-qdrant
    ports:
      - "6333:6333"   # REST API
      - "6334:6334"   # gRPC
    env_file:
      - chatbot_local/.env
    environment:
      # Qdrant reads its API key from this exact var name.
      # Set QDRANT_API_KEY in your .env — the same value your app already uses to connect.
      QDRANT__SERVICE__API_KEY: ${QDRANT_API_KEY}
    volumes:
      - qdrant_storage:/qdrant/storage
    healthcheck:
      # authenticate the healthcheck itself, since the endpoint is now locked down
      test: ["CMD", "sh", "-c", "wget -qO- --header=\"api-key: $${QDRANT_API_KEY}\" http://localhost:6333/readyz || exit 1"]
      interval: 5s
      timeout: 3s
      retries: 10

volumes:
  qdrant_storage:
