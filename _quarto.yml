project:
  type: website
  output-dir: output
  render: 
    - "/site"
    - "index.qmd"

website:
  search:
    show-item-context: true
  title: "PA Knowledge Base"
  image: site/media/ochco_logo_vertical.png
  favicon: site/media/OCHCOlogo.png
  repo-url: https://posit.co/
  repo-actions: [edit]
  page-footer:
    center:
      - text: "Our Team & POC Guide"
        href: site/employee-resources/pa-resources/our-team-poc-guide/main.qmd
    right:
      - icon: github
        href: https://posit.co/
        aria-label: PA Knowledge Base GitHub
  navbar:
    title: false
    background: "#C8F0FF"
    logo: site/media/ochco_logo_vertical.png
    left:
      - text: Home
        href: index.qmd
        icon: "house"
      - text: Data Products & Use Cases
        href: site/data-products-use-cases/main.qmd
      - text: Technology & Analytics References
        href: site/technology-analytics-references/main.qmd
    foreground: "#7B7B7D"
    tools:
      - icon: github
        menu:
          - text: DUMMY GitHub Repository Link
            href: https://posit.co/
  sidebar:
  - id: begin
    title: "Home"
    style: "docked"
    collapse-level: 2
    background: "white"
    foreground: "#7B7B7D"
    search: true
    href: index.qmd
  - id: dp-us
    title: "Data Products & Use Cases"
    collapse-level: 2
    contents:
      - text: "Data Products & Use Cases Overview"
        href: site/data-products-use-cases/main.qmd
      - text: "---"
      - text: "---"
      - section: "Data Product Management & Governance"
        contents:
          - text: "Data Process and Roles"
            href: site/data-products-use-cases/data-product-management-&-governance/data-process-and-roles.qmd
      - text: "---"
  - id: taref
    title: "Technology & Analytics References"
    collapse-level: 1
    contents:
      - text: "Technology & Analytics References Overview"
        href: site/technology-analytics-references/main.qmd
