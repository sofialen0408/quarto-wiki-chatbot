format:
  html:
    theme: 
      light: yeti
      dark: [yeti, theme-dark.scss]
    css: styles.css
    grid:
      sidebar-width: 200px
    toc: true
    include-after-body: chatbot-toggle.html

freeze: true
editor: visual
stylesheets:
